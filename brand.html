<!-- The brand lockup companygraph.io opens with, the same markup: the mark draws in
     currentColor and the wordmark's second half takes the accent, so both follow the theme
     where an image could not. Copied rather than shared for the reason every surface in this
     family copies it — the design package styles .brand and ships no SVG for it. -->
<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor"
     stroke-width="1.5" stroke-linecap="square">
  <rect x="2" y="6.75" width="10.5" height="10.5" rx="1.5"/>
  <rect x="4.75" y="9.5" width="5" height="5" fill="currentColor" stroke="none"/>
  <path d="M12.5 12 h4.5"/>
  <rect x="17" y="9.5" width="5" height="5" fill="currentColor" stroke="none"/>
</svg><b>Company<span>Graph</span></b>
